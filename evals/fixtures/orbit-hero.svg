      <text x="716" y="287" fill="#789086" font-size="9" font-weight="700" letter-spacing="1.3">WORKSPACE</text>
      <rect x="707" y="302" width="118" height="36" rx="9" fill="#98F0CA" fill-opacity="0.10"/>
      <circle cx="724" cy="320" r="6" stroke="#8CE8BE"/><path d="M728 324L733 329" stroke="#8CE8BE"/>
      <text x="744" y="324" fill="#D8E8E1" font-size="11" font-weight="600">Research</text>
      <path d="M719 361H731M725 355V367" stroke="#6F887D" stroke-linecap="round"/>
      <text x="744" y="364" fill="#91A49C" font-size="11">New project</text>
      <path d="M717 394H731V405H717Z" stroke="#6F887D"/><path d="M720 394V391H725L728 394" stroke="#6F887D"/>
      <text x="744" y="402" fill="#91A49C" font-size="11">Library</text>
      <text x="716" y="452" fill="#5E756B" font-size="9" font-weight="700" letter-spacing="1.2">RECENT</text>
      <circle cx="720" cy="478" r="3" fill="#6FE2AF"/>
      <text x="732" y="481" fill="#82968D" font-size="10">Climate compute</text>
      <circle cx="720" cy="510" r="3" fill="#71877E"/>
      <text x="732" y="513" fill="#82968D" font-size="10">Market signals</text>
      <circle cx="720" cy="542" r="3" fill="#71877E"/>
      <text x="732" y="545" fill="#82968D" font-size="10">Protein folding</text>

      <!-- main workspace -->
      <text x="870" y="291" fill="#7F968C" font-size="10" font-weight="700" letter-spacing="1.2">SYNTHESIS  /  03</text>
      <text x="870" y="326" fill="#F0F6F3" font-size="22" font-weight="700" letter-spacing="-0.5">How will AI reshape discovery?</text>
      <g transform="translate(870 348)">
        <rect width="57" height="22" rx="11" fill="#17322A"/><circle cx="12" cy="11" r="3" fill="#82EDBD"/><text x="21" y="15" fill="#99DDBF" font-size="9" font-weight="600">Live</text>
        <text x="69" y="15" fill="#6F877D" font-size="10">42 sources  •  Updated 2m ago</text>
      </g>

      <rect x="862" y="389" width="401" height="162" rx="14" fill="#13231E" stroke="#C1EADC" stroke-opacity="0.09"/>
      <text x="883" y="417" fill="#789087" font-size="9" font-weight="700" letter-spacing="1.1">EVIDENCE MAP</text>
      <path d="M894 502C930 485 938 438 982 452C1019 464 1021 502 1063 493C1111 482 1127 438 1174 454C1201 463 1218 490 1237 478" stroke="#62DCA9" stroke-opacity="0.28" stroke-width="1.2"/>
      <path d="M912 463L982 452L1063 493L1174 454L1220 487" stroke="#7CEABB" stroke-opacity="0.19" stroke-dasharray="3 5"/>
      <g fill="#87F0C2" filter="url(#glow)">
        <circle cx="982" cy="452" r="5"/><circle cx="1063" cy="493" r="4"/><circle cx="1174" cy="454" r="5"/>
      </g>
      <g fill="#9FAFA9" font-size="8">
        <text x="960" y="440">AUTOMATION</text><text x="1043" y="513">SCALE</text><text x="1152" y="440">COLLABORATION</text>
      </g>
      <circle cx="913" cy="488" r="3" fill="#4F7465"/><circle cx="1115" cy="472" r="3" fill="#4F7465"/><circle cx="1220" cy="487" r="3" fill="#4F7465"/>

      <text x="862" y="586" fill="#789087" font-size="9" font-weight="700" letter-spacing="1.1">ORBIT'S BRIEF</text>
      <rect x="862" y="602" width="401" height="117" rx="14" fill="#F0F6F2"/>
      <rect x="878" y="619" width="3" height="78" rx="1.5" fill="#66DCA8"/>
      <text x="895" y="633" fill="#15231E" font-size="12" font-weight="700">Research moves from search to sensemaking.</text>
      <text x="895" y="657" fill="#4E6159" font-size="10.5">
        <tspan x="895" dy="0">Teams adopting AI copilots report faster literature review,</tspan>
        <tspan x="895" dy="17">but verification remains the constraint. The advantage shifts</tspan>
        <tspan x="895" dy="17">to systems that preserve provenance across every insight.</tspan>
      </text>
      <g transform="translate(1191 618)">
        <rect width="54" height="20" rx="10" fill="#D8EDE4"/>
        <text x="13" y="14" fill="#32624F" font-size="8" font-weight="700">CITED</text>
      </g>
    </g>

    <!-- floating insight -->
    <g transform="translate(649 600)">
      <rect width="187" height="128" rx="18" fill="#192C25" stroke="#A9E7CE" stroke-opacity="0.23"/>
      <circle cx="25" cy="26" r="11" fill="#88EABD" fill-opacity="0.16"/>
      <path d="M22 26L25 29L30 22" stroke="#91F1C6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="30" fill="#CBE4D9" font-size="10" font-weight="700" letter-spacing="0.6">CLAIM VERIFIED</text>
      <text x="18" y="60" fill="#F0F6F3" font-size="13" font-weight="700">3 independent sources</text>
      <text x="18" y="82" fill="#7E958B" font-size="10">agree on this finding.</text>
      <g transform="translate(18 97)">
        <circle cx="8" cy="8" r="8" fill="#3B5E50"/><circle cx="24" cy="8" r="8" fill="#4F7766" stroke="#192C25" stroke-width="2"/><circle cx="40" cy="8" r="8" fill="#69917F" stroke="#192C25" stroke-width="2"/>
        <text x="58" y="11" fill="#91A69D" font-size="9">98% confidence</text>
      </g>
    </g>

    <!-- proof row -->
    <g transform="translate(76 825)">
      <text x="0" y="5" fill="#5F746B" font-size="10" font-weight="700" letter-spacing="1.5">BUILT FOR CURIOUS TEAMS AT</text>
      <g fill="#758B82" font-size="15" font-weight="700" letter-spacing="0.3">
        <text x="254" y="9">NORTHSTAR</text>
        <text x="405" y="9">QUANTA</text>
        <text x="522" y="9">FIELDWORK</text>
        <text x="676" y="9">LUMEN LABS</text>
      </g>
      <g transform="translate(1033 -11)">
        <path d="M0 28H254" stroke="#9CB1A8" stroke-opacity="0.13"/>
        <circle cx="10" cy="10" r="4" fill="#72E4B2"/><text x="24" y="14" fill="#8BA097" font-size="11">SOC 2 Type II</text>
        <circle cx="132" cy="10" r="4" fill="#72E4B2"/><text x="146" y="14" fill="#8BA097" font-size="11">Private by default</text>
      </g>
    </g>
