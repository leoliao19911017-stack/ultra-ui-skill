<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="98" y1="52" x2="1290" y2="867" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1714"/>
      <stop offset="0.56" stop-color="#07110F"/>
      <stop offset="1" stop-color="#06100F"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B6FFD7"/>
      <stop offset="1" stop-color="#6BE6B3"/>
    </linearGradient>
    <linearGradient id="screen" x1="713" y1="208" x2="1258" y2="753" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172722"/>
      <stop offset="1" stop-color="#0B1714"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1040 462) rotate(90) scale(425 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54E7AD" stop-opacity="0.19"/>
      <stop offset="0.48" stop-color="#54E7AD" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#54E7AD" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="646" y="158" width="704" height="676" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="34" stdDeviation="38" flood-color="#000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip"><rect x="694" y="188" width="600" height="590" rx="26"/></clipPath>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#B9E8D5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#grid)" opacity="0.7"/>
  <circle cx="1040" cy="462" r="425" fill="url(#halo)"/>
  <path d="M-54 746C238 583 428 895 725 752C1008 615 1167 718 1498 529" stroke="#79F2C2" stroke-opacity="0.045" stroke-width="1.2"/>

  <!-- header -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(76 45)">
      <circle cx="18" cy="18" r="16.5" stroke="#99F6CE" stroke-width="1.5"/>
      <ellipse cx="18" cy="18" rx="25" ry="8.5" transform="rotate(-24 18 18)" stroke="#99F6CE" stroke-width="1.4"/>
      <circle cx="35.2" cy="10.2" r="3.2" fill="#99F6CE"/>
      <text x="51" y="25" fill="#F2F8F5" font-size="24" font-weight="700" letter-spacing="-0.6">orbit</text>
    </g>

    <g fill="#A9BBB4" font-size="14" font-weight="500">
      <text x="550" y="69">Product</text>
      <path d="M611 63L615 67L619 63" stroke="#A9BBB4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="659" y="69">Solutions</text>
      <path d="M728 63L732 67L736 63" stroke="#A9BBB4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="776" y="69">Customers</text>
      <text x="875" y="69">Resources</text>
      <text x="969" y="69">Pricing</text>
    </g>

    <g transform="translate(1143 37)">
      <text x="0" y="33" fill="#C9D8D2" font-size="14" font-weight="600">Sign in</text>
      <rect x="75" y="0" width="146" height="48" rx="24" fill="#EDF8F2"/>
      <text x="103" y="30" fill="#0A1612" font-size="14" font-weight="700">Start researching</text>
    </g>
    <path d="M76 106H1364" stroke="#A7C2B7" stroke-opacity="0.13"/>

    <!-- hero copy -->
    <g transform="translate(76 183)">
      <g>
        <rect width="206" height="36" rx="18" fill="#12241F" stroke="#91EFC7" stroke-opacity="0.26"/>
        <circle cx="20" cy="18" r="4" fill="#8EF1C5" filter="url(#glow)"/>
        <text x="34" y="23" fill="#BFE9D6" font-size="12" font-weight="700" letter-spacing="0.8">AI RESEARCH WORKSPACE</text>
      </g>

      <text x="0" y="114" fill="#F3F7F5" font-size="74" font-weight="700" letter-spacing="-4.4">Go deeper.</text>
      <text x="0" y="190" fill="#F3F7F5" font-size="74" font-weight="700" letter-spacing="-4.4">Know sooner.</text>
      <path d="M4 211C91 201 206 201 316 211" stroke="#82EDBF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

      <text x="0" y="257" fill="#AFC0B9" font-size="19" font-weight="400">
        <tspan x="0" dy="0">Orbit turns the open web and your knowledge base</tspan>
        <tspan x="0" dy="30">into clear, cited answers—without losing the thread.</tspan>
      </text>

      <g transform="translate(0 330)">
        <rect width="188" height="58" rx="29" fill="url(#mint)"/>
        <text x="29" y="36" fill="#07130F" font-size="15" font-weight="700">Start for free</text>
        <circle cx="157" cy="29" r="16" fill="#0B1B15"/>
        <path d="M151 29H162M158 25L162 29L158 33" stroke="#C7FCE4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="203" width="164" height="58" rx="29" stroke="#AFC8BE" stroke-opacity="0.27"/>
        <circle cx="231" cy="29" r="15" stroke="#BCD0C8" stroke-opacity="0.55"/>
        <path d="M227 24L237 29L227 34V24Z" fill="#DCE9E3"/>
        <text x="255" y="35" fill="#D5E1DC" font-size="15" font-weight="600">See it in action</text>
      </g>

      <g transform="translate(0 448)">
        <g fill="#DCE8E3">
          <circle cx="18" cy="18" r="18" fill="#243A33"/><text x="10" y="23" font-size="12" font-weight="700">MK</text>
          <circle cx="46" cy="18" r="18" fill="#34564A" stroke="#0A1512" stroke-width="3"/><text x="38" y="23" font-size="12" font-weight="700">JL</text>
          <circle cx="74" cy="18" r="18" fill="#48685D" stroke="#0A1512" stroke-width="3"/><text x="66" y="23" font-size="12" font-weight="700">AS</text>
        </g>
        <g transform="translate(104 1)">
          <path d="M1 9.5L3.5 15L9.5 15.7L5 19.7L6.2 25.5L1 22.6L-4.2 25.5L-3 19.7L-7.5 15.7L-1.5 15Z" fill="#8FE9C2"/>
          <text x="18" y="20" fill="#E4EDE9" font-size="14" font-weight="700">4.9</text>
          <text x="48" y="20" fill="#81958D" font-size="13">Loved by 8,000+ research teams</text>
        </g>
      </g>
    </g>

    <!-- product visual -->
    <g filter="url(#shadow)">
      <rect x="694" y="188" width="600" height="590" rx="26" fill="url(#screen)" stroke="#B8E8D5" stroke-opacity="0.19"/>
    </g>
    <g clip-path="url(#panelClip)">
      <circle cx="1261" cy="225" r="122" fill="#6FF2BE" fill-opacity="0.045"/>
      <rect x="694" y="188" width="600" height="64" fill="#15251F"/>
      <path d="M694 252H1294" stroke="#C8EDDF" stroke-opacity="0.10"/>
      <circle cx="723" cy="220" r="5" fill="#F27470"/><circle cx="741" cy="220" r="5" fill="#E6C56F"/><circle cx="759" cy="220" r="5" fill="#6FD4A5"/>
      <rect x="809" y="205" width="346" height="31" rx="15.5" fill="#0B1713" stroke="#C4EBDD" stroke-opacity="0.09"/>
      <circle cx="831" cy="220.5" r="5.5" stroke="#79968A"/>
      <path d="M835 225L840 230" stroke="#79968A" stroke-linecap="round"/>
      <text x="851" y="224" fill="#81958D" font-size="11">Ask Orbit anything...</text>
